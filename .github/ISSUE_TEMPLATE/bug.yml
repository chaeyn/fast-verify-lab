name: Bug report
description: Report a result that differs from the documented behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys and private prompts. Report security problems through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      description: Run fast-verify --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Python version, terminal, and provider.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small public example. Include the command and expected result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error and review status. Remove private data.
    validations:
      required: true
