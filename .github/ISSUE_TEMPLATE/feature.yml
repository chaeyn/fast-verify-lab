name: Feature request
description: Describe a task that the current version cannot do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User task
      description: Describe the task and the current limitation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Give an example input and output. Include alternatives if useful.
    validations:
      required: true
